# Repository: juphc-tc_pipeline
# URL: https://github.com/Kelvin-vin7/juphc-tc_pipeline/blob/main/run.yaml
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: juphc-tc-pipeline-run-
spec:
  pipelineRef:
    name: juphc-tc-pipeline
  params:
    - name: repo-url
      value: "https://github.com/Kelvin-vin7/zntwk-tax_calculator.git"
    - name: branch
      value: "main"
    - name: build-image
      value: "image-registry.openshift-image-registry.svc:5000/sn-labs-kelvin057/tax-calculator:latest"
    - name: app-name
      value: "tax-calculator"
  workspaces:
    - name: pipeline-workspace
      persistentVolumeClaim:
        claimName: pipelinerun-pvc
    - name: dockerconfig-ws
      emptyDir: {}
