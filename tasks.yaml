# Repository: juphc-tc_pipeline
# URL: https://github.com/Kelvin-vin7/juphc-tc_pipeline/blob/main/tasks.yaml
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: This task will clean up a workspace by deleting all of the files.
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu
        echo "Removing all files from ${WORKSPACE_SOURCE_PATH} ..."
        # Delete any existing contents of the directory if it exists.
        #
        # We don't just "rm -rf ${WORKSPACE_SOURCE_PATH}" because ${WORKSPACE_SOURCE_PATH} might be "/"
        # or the root of a mounted volume.
        if [ -d "${WORKSPACE_SOURCE_PATH}" ] ; then
          # Delete non-hidden files and directories
          rm -rf "${WORKSPACE_SOURCE_PATH:?}"/*
          # Delete files and directories starting with . but excluding ..
          rm -rf "${WORKSPACE_SOURCE_PATH}"/.[!.]*
          # Delete files and directories starting with .. plus any other character
          rm -rf "${WORKSPACE_SOURCE_PATH}"/..?*
        fi
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm
spec:
  description: This task runs npm commands (for example npm install) in the source workspace.
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments to pass to npm
      type: string
      default: "install"
  steps:
    - name: npm
      image: node:18
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        echo "Running: npm $(params.args)"
        npm $(params.args)
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jasmine
spec:
  description: This task runs the Jasmine unit tests.
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments to pass to jasmine
      type: string
      default: ""
  steps:
    - name: jasmine
      image: node:18
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        npx jasmine $(params.args)
