# Repository: juphc-tc_pipeline
# URL: https://github.com/Kelvin-vin7/juphc-tc_pipeline/blob/main/tasks.yaml
# This file contains the two new Tekton task definitions: npm and jasmine
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm
spec:
  description: This task runs npm commands (for example npm install) in the source workspace.
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments to pass to npm
      type: string
      default: "install"
  steps:
    - name: npm
      image: node:18
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        echo "Running: npm $(params.args)"
        npm $(params.args)
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jasmine
spec:
  description: This task runs the Jasmine unit tests.
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments to pass to jasmine
      type: string
      default: ""
  steps:
    - name: jasmine
      image: node:18
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        npx jasmine $(params.args)
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: This task will clean up a workspace by deleting all of the files.
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu
        echo "Removing all files from $(workspaces.source.path) ..."
        rm -rf "$(workspaces.source.path)"/* "$(workspaces.source.path)"/.[!.]* "$(workspaces.source.path)"/..?* || true
